name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Create the GitHub Release (runs once)
  # ──────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: 'ORNAS ${{ github.ref_name }}'
          body: |
            ## ORNAS ${{ github.ref_name }}

            Download the installer for your platform below.

            | Platform | File |
            |----------|------|
            | **Linux (Debian/Ubuntu)** | `.deb` |
            | **Linux (Fedora/RHEL)** | `.rpm` |
            | **Linux (Universal)** | `.AppImage` |
            | **Windows** | `.msi` or `.exe` |
            | **macOS** | `.dmg` |

            ---

            > **Windows & macOS**: Binaries are currently unsigned. Your OS may display a security warning. See [SIGNING.md](https://github.com/sanromarth/ornas/blob/main/SIGNING.md) for bypass instructions.

            See the [CHANGELOG](https://github.com/sanromarth/ornas/blob/main/CHANGELOG.md) for a full list of changes.
          draft: true
          prerelease: true

  # ──────────────────────────────────────────────────────────
  # Job 2: Build on each platform and upload to the release
  # ──────────────────────────────────────────────────────────
  build-and-upload:
    needs: create-release
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────
          - platform: ubuntu-22.04
            rust_targets: ''
            args: ''

          # ── Windows ────────────────────────────────────────
          - platform: windows-latest
            rust_targets: ''
            args: ''

          # ── macOS (Apple Silicon) ──────────────────────────
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          # ── macOS (Intel) ──────────────────────────────────
          - platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # ────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # 2. Node.js
      # ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ────────────────────────────────────────────────────────
      # 3. Rust
      # ────────────────────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compilation target
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ────────────────────────────────────────────────────────
      # 4. System Dependencies (Linux only)
      # ────────────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ────────────────────────────────────────────────────────
      # 5. Install frontend dependencies
      # ────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ────────────────────────────────────────────────────────
      # 6. Build Tauri app & upload to existing release
      # ────────────────────────────────────────────────────────
      - name: Build and upload
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
